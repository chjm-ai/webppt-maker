<article class="slide" data-slide-id="tracks" data-layout="tracks">
  <header class="page-head"><h2>人工记录与系统记录，差在背景</h2><div class="brand" data-template-only="deepleaper-dark"><img src="wordmark-white-transparent.png" alt="Deepleaper 跃盟科技"></div></header>
  <p class="slide-subtitle">同一个顾客，两种记录方式留下的信息深度不同。</p>
  <div class="content ly-page">
    <div class="ly-tracks">
      <div class="ly-track">
        <div class="ly-track-label"><span class="ly-kicker">面向店员</span><strong>人工记录</strong></div>
        <div class="ly-track-box">原始记录</div>
        <span class="ly-arrow" aria-hidden="true">→</span>
        <div class="ly-track-box">字段与标签</div>
        <span class="ly-arrow" aria-hidden="true">→</span>
        <div class="ly-track-box">交接与报表</div>
      </div>
      <div class="ly-track is-accent">
        <div class="ly-track-label"><span class="ly-kicker">面向分析</span><strong>系统记录</strong></div>
        <div class="ly-track-box">原始记录<br>＋ 背景</div>
        <span class="ly-arrow" aria-hidden="true">→</span>
        <div class="ly-track-box">消费与到店分析</div>
        <span class="ly-arrow" aria-hidden="true">→</span>
        <div class="ly-track-box">可执行的建议</div>
      </div>
    </div>
    <p class="ly-note">只保留字段会丢掉原因；保留原话才能解释变化。</p>
  </div>
</article>
